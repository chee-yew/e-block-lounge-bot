services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e_block_bot
      POSTGRES_USER: e_block_bot
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      E_BLOCK_TIMEZONE: ${E_BLOCK_TIMEZONE:-Asia/Singapore}
      LOUNGE_OPEN_TIME: ${LOUNGE_OPEN_TIME:-10:00}
      LOUNGE_CLOSE_TIME: ${LOUNGE_CLOSE_TIME:-22:00}
      SLOT_DURATION_MINUTES: ${SLOT_DURATION_MINUTES:-120}
      DATABASE_URL: postgresql+asyncpg://e_block_bot:change-this-password@db:5432/e_block_bot
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
