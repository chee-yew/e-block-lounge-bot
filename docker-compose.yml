services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e_block_bot
      POSTGRES_USER: e_block_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      E_BLOCK_TIMEZONE: ${E_BLOCK_TIMEZONE:-Asia/Singapore}
      SLOT_INCREMENT_MINUTES: ${SLOT_INCREMENT_MINUTES:-30}
      MAX_DAILY_BOOKING_MINUTES: ${MAX_DAILY_BOOKING_MINUTES:-180}
      DATABASE_URL: postgresql+asyncpg://e_block_bot:${POSTGRES_PASSWORD}@db:5432/e_block_bot
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
