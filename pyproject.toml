[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e-block-lounge-bot"
version = "0.1.0"
description = "A Telegram bot for conflict-free E Block lounge bookings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22,<4",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/e_block_bot"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["e_block_bot"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["e_block_bot"]
